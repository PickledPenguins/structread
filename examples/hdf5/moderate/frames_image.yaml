# One frame's image data as raw bytes. The declared type and shape are checked
# against the file, so a capture with different frame geometry fails loudly.
name: frames_image
description: Frame image data from an HDF5 capture, as raw bytes.

aliases:
  n: index

input:
  format: hdf5
  fields:
    - {at: "/data/frame{n}/data", name: frame, type: u16, shape: [4, 6]}

output:
  format: bin
  fields: [frame]
